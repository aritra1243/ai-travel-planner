<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta -->
    <title>Vagabond — AI Travel Planner | Plan Your Dream Trip with AI</title>

    <meta name="keywords" content="AI travel planner, itinerary generator, trip planner, travel planning, budget travel, OpenStreetMap, Gemini AI" />
    <meta name="author" content="Vagabond" />
    <meta name="theme-color" content="#8b9c86" />

    <!-- Open Graph / Social Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vagabond — AI Travel Planner" />
    <meta property="og:description" content="Plan your perfect trip with AI. Generate detailed itineraries, interactive maps, and budget estimates for free." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:url" content="https://vagabond.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vagabond — AI Travel Planner" />
    <meta name="twitter:description" content="Plan your perfect trip with AI. Free itinerary generator with maps and budget estimates." />

    <!-- Favicon (inline SVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b9c86'><circle cx='12' cy='12' r='10'/><path fill='white' d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z'/></svg>" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />

    <!-- Defensive fetch patch for sandboxed environments -->
    <script>
      try {
        const originalFetch = window.fetch;
        let currentFetch = originalFetch;
        Object.defineProperty(window, 'fetch', {
          get() { return currentFetch; },
          set(val) { currentFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("fetch proxy patch skipped:", e);
      }
    </script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
  </head>

  </body>
